<!doctype html>
<html lang="en">
  <head>

    <title>Islands dev sandbox</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <!--
      Dev-only sandbox for previewing islands with `npm run dev`. Not part
      of the production build — vite.config.ts's build.rollupOptions.input
      only includes island entry points, not this file — and never
      deployed. Add a mount div + script tag here for each island as it's
      built, matching the id the island's own main.tsx looks for.
    -->
    <h2>Drill — HTTP 401 vs 403</h2>
    <div id="drill-http-401-403-root"></div>
    <script type="module" src="/src/islands/drill-401-403/main.tsx"></script>

    <hr />

    <h2>Case — "trust relationship" error</h2>
    <div id="case-trust-relationship-root"></div>
    <script type="module" src="/src/islands/case-trust-relationship/main.tsx"></script>

    <hr />

    <h2>Placement quiz — Networking Fundamentals</h2>
    <div id="placement-quiz-networking-root"></div>
    <script type="module" src="/src/islands/placement-quiz/main.tsx"></script>

    <hr />

    <h2>Case — DHCP APIPA fallback</h2>
    <div id="case-dhcp-apipa-root"></div>
    <script type="module" src="/src/islands/case-dhcp-apipa/main.tsx"></script>

    <hr />

    <h2>Drill — DHCP Event 1059</h2>
    <div id="drill-dhcp-1059-root"></div>
    <script type="module" src="/src/islands/drill-dhcp-1059/main.tsx"></script>
  </body>
</html>
