name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; a newer push supersedes an older one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - run: npm run build
        working-directory: app

      # Assemble the deployed site from hand-written static files at the
      # repo root plus the built island bundles — these are two separately
      # authored halves (see root CLAUDE.md), combined only here at deploy
      # time. Nothing under app/src, docs, or repo-management files ships.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp CNAME _site/
          cp -r app/dist/islands _site/islands

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
